name: publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish TypeScript SDK
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@allowly/sdk
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require tag commit on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Require public verifier release
        run: |
          verifier_version="$(node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const spec = JSON.parse(readFileSync("package.json", "utf8")).dependencies?.["@allowly/verifier"];
          const version = typeof spec === "string" && /^\^?(\d+\.\d+\.\d+)$/.exec(spec)?.[1];
          if (!version) throw new Error("Release dependencies must use an exact or caret stable verifier version, not sibling-source staging");
          console.log(version);
          NODE
          )"
          published_version="$(npm view "@allowly/verifier@$verifier_version" version --registry=https://registry.npmjs.org)"
          test "$published_version" = "$verifier_version"
          echo "ALLOWLY_VERIFIER_RELEASE=$verifier_version" >> "$GITHUB_ENV"
      - name: Require registry-backed verifier lock
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const packageJson = JSON.parse(readFileSync("package.json", "utf8"));
          const lock = JSON.parse(readFileSync("package-lock.json", "utf8"));
          const root = lock.packages?.[""];
          const verifier = lock.packages?.["node_modules/@allowly/verifier"];
          const version = process.env.ALLOWLY_VERIFIER_RELEASE;
          const fail = (message) => {
            console.error(message);
            process.exit(1);
          };

          if (!version || packageJson.dependencies?.["@allowly/verifier"]?.replace(/^\^/, "") !== version) {
            fail("package.json must require the public verifier release checked above");
          }
          if (root?.dependencies?.["@allowly/verifier"] !== packageJson.dependencies["@allowly/verifier"]) {
            fail("package-lock.json root metadata is not synchronized with package.json");
          }
          for (const [location, spec] of [
            ["package.json devDependencies", packageJson.devDependencies?.["@allowly/verifier"]],
            ["package-lock.json root devDependencies", root?.devDependencies?.["@allowly/verifier"]],
          ]) {
            if (typeof spec === "string" && /^(file:|link:|workspace:)/.test(spec)) {
              fail(`${location} still uses the local verifier source`);
            }
          }
          if (Object.keys(lock.packages ?? {}).some((key) =>
            key.includes("allowly-receipt-format/verifiers/typescript"))) {
            fail("package-lock.json still contains the local verifier package");
          }
          if (!verifier || verifier.link === true || verifier.version !== version) {
            fail(`package-lock.json must contain a non-link @allowly/verifier ${version} entry`);
          }
          if (typeof verifier.resolved !== "string") {
            fail("the verifier lock entry has no registry tarball URL");
          }
          const resolved = new URL(verifier.resolved);
          if (
            resolved.protocol !== "https:" ||
            resolved.hostname !== "registry.npmjs.org" ||
            resolved.pathname !== `/@allowly/verifier/-/verifier-${version}.tgz`
          ) {
            fail("the verifier lock entry is not backed by the public npm registry");
          }
          if (typeof verifier.integrity !== "string" || !verifier.integrity.startsWith("sha512-")) {
            fail("the verifier lock entry has no tool-generated sha512 integrity");
          }
          NODE
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Check tag matches package version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          test "$tag_version" = "$package_version"
      - name: Refuse to overwrite published version
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          if npm view "$package_name@$package_version" version >/dev/null 2>&1; then
            echo "$package_name@$package_version is already published"
            exit 1
          fi
      - run: npm publish --access public
