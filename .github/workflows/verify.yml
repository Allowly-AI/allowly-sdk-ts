name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify TypeScript SDK
    runs-on: ubuntu-latest
    steps:
      - name: Check out TypeScript SDK
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install SDK dependencies
        run: npm ci
      - name: Typecheck SDK
        run: npm run typecheck
      - name: Test SDK
        run: npm test
      - name: Build SDK
        run: npm run build
